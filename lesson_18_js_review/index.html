<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson 18 - JavaScript Review</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --text: #1f2937;
        --accent: #0f766e;
        --accent-soft: #ccfbf1;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(140deg, #e0f2fe, #f0fdf4 55%, #fef9c3);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(760px, 100%);
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(1.3rem, 2.5vw, 2rem);
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 14px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        cursor: pointer;
        background: var(--accent);
        color: #fff;
      }

      button.secondary {
        background: #334155;
      }

      ul {
        margin: 14px 0;
        padding-left: 20px;
      }

      .muted {
        background: var(--accent-soft);
        border-radius: 8px;
        padding: 10px 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 id="title">JavaScript Review Playground</h1>

      <div class="controls">
        <button id="reviewBtn">Add Task</button>
        <button class="secondary" id="loadUsersBtn">Load 3 Users</button>
      </div>

      <p id="taskCount" class="muted">Tasks: 0</p>
      <ul id="taskList"></ul>

      <p id="usersOutput" class="muted">Users: not loaded</p>
    </main>

    <script src="./index.js"></script>
  </body>
</html>
